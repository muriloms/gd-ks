name: PR Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title follows conventional commits
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const re = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?:\s.+/;
            if (!re.test(title)) {
              core.setFailed(`PR title must follow Conventional Commits.\nGot: "${title}"\nExamples: "feat(state): add project-state", "fix(compiler): handle anchors"`);
            }

  changelog-updated:
    name: CHANGELOG updated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check CHANGELOG.md was touched
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          # Skip this check for PRs labeled "no-changelog"
          if git diff --name-only "$BASE" "$HEAD" | grep -qx "CHANGELOG.md"; then
            echo "✓ CHANGELOG.md updated"
          else
            echo "⚠  CHANGELOG.md not updated — add an entry or apply the 'no-changelog' label if this is trivial"
            # Warn, don't fail (v0.4 is alpha)
          fi
