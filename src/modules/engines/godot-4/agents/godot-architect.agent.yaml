actions:
  godot-architecture: |
    # 🏗️ Godot 4 Architecture

    ## Scene Tree Strategy

    - **Main scenes:** game, menu, options, credits
    - **Gameplay scenes:** level templates, UI overlays
    - **Reusable components:** character bodies, enemies, pickups

    ## Script Architecture

    ```gdscript
    class_name Player
    extends CharacterBody2D

    @export var max_speed: float = 300.0
    @export var jump_force: float = 500.0

    signal health_changed(new_value: int)
    signal died

    func _physics_process(delta: float) -> void:
      ...
    ```

    ## Autoload Recommendations

    - `GameManager.gd` — global state (current level, score)
    - `AudioManager.gd` — music and SFX
    - `EventBus.gd` — cross-scene signal hub
    - `SaveSystem.gd` — save/load

    **Describe your game loop and I'll sketch the scene tree.**

  scene-tree-design: |
    # 🌳 Scene Tree Breakdown

    ## Typical Top-Level Structure

    ```
    Main (Node)
    ├── World (Node2D or Node3D)
    │   ├── Environment
    │   ├── Enemies (Node — container)
    │   ├── Pickups
    │   └── Player
    ├── UI (CanvasLayer)
    │   ├── HUD
    │   └── PauseMenu
    └── Camera (Camera2D or Camera3D)
    ```

    ## Guidelines

    - Keep hierarchies shallow (≤ 5 levels deep when possible)
    - Use `Node` containers to group siblings
    - Use `@onready` to cache child references
    - Connect signals in `_ready()` or via the editor

    **What scene do you want to design first?**

  signal-map: |
    # 📡 Signal Map

    ## Signal Categories

    **Game events (broadcast via EventBus autoload):**
    - `level_started(level_id)`
    - `level_completed(level_id, score)`
    - `player_died`
    - `game_over`

    **Entity events (emit on individual nodes):**
    - Player: `health_changed`, `died`
    - Enemy: `defeated`, `attack_started`
    - Pickup: `collected`

    **UI events:**
    - `menu_requested(menu_id)`
    - `setting_changed(key, value)`

    ## Rules

    - Emit from the producer, connect from the consumer
    - Use the EventBus only for cross-scene communication
    - Prefer typed signals: `signal health_changed(new_value: int)`

    **Which system needs a signal map?**

  autoload-plan: |
    # ⚡ Autoload Plan

    ## Minimal Autoload Set

    | Autoload | Responsibility | File |
    |---|---|---|
    | GameManager | Current level, score, difficulty | `autoloads/game_manager.gd` |
    | AudioManager | Music, SFX buses | `autoloads/audio_manager.gd` |
    | EventBus | Cross-scene signals | `autoloads/event_bus.gd` |
    | SaveSystem | Save/load to disk | `autoloads/save_system.gd` |

    ## When NOT to use an autoload

    - For data that belongs to a specific scene (keep it local)
    - For mutable state only used in one place
    - To avoid using signals properly (autoloads aren't a shortcut)

    **What systems do you think need to be global?**
