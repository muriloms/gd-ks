actions:
  engine-review-godot: |
    # 🔍 Godot Engine Spec Review

    ## Review Checklist

    ### Scene Architecture
    - [ ] Scene tree designed per feature
    - [ ] Reusable components identified (inherit-from-scene)
    - [ ] Autoloads planned (GameManager, EventBus, etc.)

    ### Script Specifications
    - [ ] Every story names a `.gd` file path
    - [ ] Class inheritance chains documented
    - [ ] Signal contracts defined (producer → consumer)
    - [ ] Static typing enforced

    ### Implementation Readiness
    - [ ] Dependencies clear (which scenes / autoloads must exist first)
    - [ ] Implementation order defined
    - [ ] LLM prompts prepared (code-prompt-godot)

    **What needs review?**

  story-tech-spec-godot: |
    # 📋 Story Technical Specification (Godot)

    ## Tech Spec Template

    ```yaml
    Story: GDKS-XXX
    Title: [Story title]

    Scenes Required:
      - scenes/player.tscn: Player character
      - scenes/enemy.tscn: Basic enemy type

    Scripts Required:
      - scripts/player.gd: extends CharacterBody2D
      - scripts/enemy.gd: extends CharacterBody2D
      - scripts/components/health.gd: extends Node

    Resources Required:
      - resources/enemies/goblin.tres: EnemyData

    Signals (producer → consumer):
      - Player.health_changed → UI.update_health_bar
      - Enemy.defeated → EventBus.enemy_defeated

    Implementation Steps:
      1. Create player.gd with movement stub
      2. Create player.tscn with CollisionShape2D
      3. Connect input, test in editor
      4. Add health component
      5. Create enemy.tscn and enemy.gd
      6. Wire signals

    Testing:
      - Run player scene directly; verify movement
      - Run main.tscn; verify enemy interactions

    Dependencies:
      - EventBus autoload must be configured first
      - StateMachine component (if used) must exist
    ```

    **Which story needs a tech spec?**

  engine-checklist-godot: |
    # ✅ Engine Phase Checklist (Godot)

    ## Documents
    - [ ] godot-architecture.md
    - [ ] scene-specifications/
    - [ ] gdscript-specifications/
    - [ ] signal-map.md
    - [ ] autoload-plan.md
    - [ ] llm-prompts/

    ## Quality
    - [ ] All stories have tech specs
    - [ ] LLM prompts are complete
    - [ ] Implementation order defined
    - [ ] Static typing enforced in all specs

    ## Readiness
    - [ ] First story can be implemented
    - [ ] Autoloads configured in project.godot
    - [ ] Team understands scene-tree choices

    **What's your status?**
