    action: "#engine-review-godot"
    description: "[RV] 🔍 Review Godot specs - Check completeness"

  - trigger: "techspec"
    action: "#story-tech-spec-godot"
    description: "[TS] 📋 Story tech spec (Godot)"

  - trigger: "checklist"
