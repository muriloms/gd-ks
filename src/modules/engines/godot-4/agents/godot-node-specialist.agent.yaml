actions:
  scene-specs: |
    # 🎬 Scene Specification

    ## Template

    ```
    Scene: player.tscn
    Root node: CharacterBody2D (with script player.gd)

    Children:
      - Sprite2D (name: Sprite2D)
          texture: res://assets/player.png
      - CollisionShape2D (name: CollisionShape2D)
          shape: RectangleShape2D (from resource)
      - AnimationPlayer (name: AnimationPlayer)
          autoplay: idle
      - HurtBox (Area2D, script: hurt_box.gd)
          - CollisionShape2D

    Signals to connect (in editor or _ready):
      - HurtBox.area_entered → player.gd:_on_hurt_box_area_entered

    Exports to set in inspector:
      - max_speed: 300.0
      - jump_force: 500.0
    ```

    **What scene do you want to spec?**

  node-composition: |
    # 🧱 Node Composition

    ## Common Patterns

    **Enemy as composition:**
    ```
    Enemy (CharacterBody2D, enemy.gd)
    ├── Sprite2D
    ├── CollisionShape2D
    ├── HealthComponent (Node, health.gd)
    ├── HitBox (Area2D)
    ├── HurtBox (Area2D)
    └── StateMachine (Node, state_machine.gd)
        ├── IdleState (Node)
        ├── PatrolState (Node)
        └── AttackState (Node)
    ```

    Each component is a self-contained node with its own script. Enemy
    orchestrates them via signals.

    **Rules:**
    - One responsibility per component
    - Components emit signals; the parent decides what to do
    - Components can be added/removed without breaking the parent

    **What composition do you want to design?**

  resource-design: |
    # 💎 Custom Resource Design

    ## Template

    ```gdscript
    class_name EnemyData
    extends Resource

    @export var display_name: String = ""
    @export var max_health: int = 100
    @export var move_speed: float = 150.0
    @export var damage: int = 10
    @export var sprite_texture: Texture2D
    @export var attack_sound: AudioStream
    ```

    Save as `resources/enemies/goblin.tres` and assign to your
    Enemy scene's @export `data: EnemyData`.

    ## When to use Resources

    - Enemy stats, item definitions, dialogue lines
    - Any content-heavy data that doesn't change at runtime
    - Values designers want to tune without opening scripts

    ## When NOT to use Resources

    - For scene-specific runtime state
    - For anything with logic (that's what scripts are for)

    **What kind of data needs a Resource?**
