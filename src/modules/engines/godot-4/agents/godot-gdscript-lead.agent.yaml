actions:
  class-specs-godot: |
    # 📜 GDScript Class Specifications

    ## Template

    ```gdscript
    class_name <ClassName>
    extends <BaseNode>

    ## One-line summary of this class's responsibility.
    ##
    ## Longer description if needed. Explain ownership and dependencies.

    #region Exports
    @export var max_speed: float = 300.0
    @export var damage: int = 10
    @export_range(0.0, 1.0) var friction: float = 0.85
    #endregion

    #region Signals
    signal health_changed(new_value: int)
    signal died
    #endregion

    #region State
    var _current_health: int = 100
    var _is_alive: bool = true
    #endregion

    #region Cached refs
    @onready var _sprite: Sprite2D = $Sprite2D
    @onready var _anim: AnimationPlayer = $AnimationPlayer
    #endregion

    func _ready() -> void:
      # setup
      pass

    func take_damage(amount: int) -> void:
      _current_health = max(0, _current_health - amount)
      health_changed.emit(_current_health)
      if _current_health == 0 and _is_alive:
        _die()

    func _die() -> void:
      _is_alive = false
      died.emit()
    ```

    ## Per-class questions

    - What node type does this extend?
    - What @export vars do designers need?
    - What signals does it emit?
    - What does _ready do?

    **Which story needs a class spec?**

  code-prompt-godot: |
    # 🤖 Godot Code Generation Prompt

    ## Template

    ```
    You are implementing a single story from a larger Godot 4 project.

    ## Project Context

    - **Engine:** Godot 4.x (GDScript)
    - **Game:** [Project name]
    - **Preset:** [e.g., solo-indie]

    ## Story

    [Paste the story from _gdks-output/03-planning/stories.md]

    ## Existing Structure

    - scenes/ — scene files (.tscn)
    - scripts/ — GDScript files (.gd)
    - resources/ — .tres data files
    - autoloads/ — singletons

    ## What to produce

    1. One new GDScript file: [path]
    2. Class must extend: [base node type]
    3. Properties with @export where listed in the story
    4. Signals: [list]
    5. Methods: [list with signatures]

    ## Rules

    - Use static typing on every var, parameter, and return
    - Use @export for designer-tunable values with sensible defaults
    - Follow snake_case for identifiers
    - No print() debug statements in final code
    - Include brief ## docstrings on public methods

    ## Reject if

    - You use `var x` without a type annotation
    - You emit signals from consumers instead of producers
    - You use autoloads where a signal would suffice

    ## Output format

    The full .gd file, with no prose before or after.
    ```

    **Which story do you want a prompt for?**

  typing-review: |
    # 🔍 Type-Safety Review

    ## Checklist

    - [ ] Every `var` has a type annotation (`: Type`)
    - [ ] Every function param is typed
    - [ ] Every function has a return type (`-> void` if none)
    - [ ] Arrays use typed form when possible: `Array[int]`
    - [ ] Dictionaries have key/value type hints where possible
    - [ ] No `as` casts that could fail silently

    ## Smells

    - `var foo = get_node(...)` — missing return type from get_node
    - `func do_thing(x)` — untyped param
    - `if obj:` — implicit truthiness (use `if obj != null:`)

    **Paste a script here for me to review.**
