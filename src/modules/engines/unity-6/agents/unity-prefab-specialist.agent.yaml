actions:
  prefab-specs: |
    # 🧩 Prefab Specification

    ## Template

    ```
    Prefab: Player.prefab
    Location: Assets/_Project/Prefabs/Player/

    Root GameObject: Player
    Components on root:
      - Transform
      - Rigidbody2D (dynamic, gravityScale: 3)
      - CapsuleCollider2D (size: 0.8 x 1.6)
      - Player (script)
      - SpriteRenderer (sortingLayer: Characters)
      - Animator (controller: PlayerAnimator)

    Children:
      - GroundCheck (empty GameObject)
          - Position: (0, -0.85, 0)
      - HurtBox (child prefab: HurtBox.prefab)
      - AudioSource

    Dependencies:
      - PlayerDataSO (assigned to Player.data)
      - PlayerAnimator (AnimatorController)
      - Layers: Player, Ground, Hurtable

    Serialized overrides from base: none (this is the base prefab)
    ```

    **What prefab do you want to spec?**

  variant-strategy: |
    # 🔀 Prefab Variant Strategy

    ## When to use a Variant

    - You have several enemies that share 80% of the same setup
    - Only a few fields differ (sprite, stats, animator)
    - You want designers to create more at will

    ## When NOT to use a Variant

    - The child would override more than 40% of the parent
    - The class hierarchy is different (use separate prefabs)
    - You'd create chains deeper than 2 levels (variant-of-variant is a smell)

    ## Example Layout

    ```
    Enemies/
    ├── BaseEnemy.prefab         ← root variant
    ├── Goblin.prefab            (variant of BaseEnemy)
    │   ├── override: sprite, EnemyDataSO → GoblinDataSO
    ├── Skeleton.prefab          (variant of BaseEnemy)
    │   ├── override: sprite, EnemyDataSO → SkeletonDataSO
    └── EliteGoblin.prefab       (variant of Goblin)
        ├── override: scale, EnemyDataSO → EliteGoblinDataSO
    ```

    **What entity family needs variant planning?**

  so-assets: |
    # 💎 ScriptableObject Asset Layout

    ## Folder Structure

    ```
    Assets/_Project/ScriptableObjects/
    ├── Enemies/
    │   ├── GoblinData.asset
    │   ├── SkeletonData.asset
    │   └── ...
    ├── Weapons/
    │   ├── SwordData.asset
    │   └── BowData.asset
    ├── Events/
    │   ├── OnPlayerDeath.asset    (GameEventSO)
    │   ├── OnLevelComplete.asset
    │   └── OnScoreChanged.asset
    └── Variables/
        ├── PlayerScore.asset      (IntVariableSO)
        └── PlayerHealth.asset
    ```

    ## Naming

    - Data: `<EntityName>Data.asset` (e.g., `GoblinData`)
    - Event: `On<EventName>.asset` (e.g., `OnPlayerDeath`)
    - Variable: `<SystemName><Property>.asset` (e.g., `PlayerScore`)

    **What SO assets does your project need?**
