actions:
  class-specs-unity: |
    # 📜 C# Class Specifications

    ## MonoBehaviour Template

    ```csharp
    using UnityEngine;

    namespace Game.Gameplay {
        /// <summary>
        /// One-line summary of this component's responsibility.
        /// </summary>
        [DisallowMultipleComponent]
        [RequireComponent(typeof(Rigidbody2D))]
        public class Player : MonoBehaviour {

            #region Serialized Fields
            [Header("Movement")]
            [SerializeField] private float maxSpeed = 5f;
            [SerializeField] private float acceleration = 20f;

            [Header("Data")]
            [SerializeField] private PlayerDataSO data;
            #endregion

            #region State
            private int _currentHealth;
            private bool _isAlive = true;
            #endregion

            #region Cached Components
            private Rigidbody2D _rb;
            #endregion

            #region Events
            public event System.Action<int> HealthChanged;
            public event System.Action Died;
            #endregion

            private void Awake() {
                _rb = GetComponent<Rigidbody2D>();
                _currentHealth = data.maxHealth;
            }

            public void TakeDamage(int amount) {
                _currentHealth = Mathf.Max(0, _currentHealth - amount);
                HealthChanged?.Invoke(_currentHealth);
                if (_currentHealth == 0 && _isAlive) Die();
            }

            private void Die() {
                _isAlive = false;
                Died?.Invoke();
            }
        }
    }
    ```

    ## Per-class questions

    - Does it extend MonoBehaviour or ScriptableObject?
    - What's in [Header]-grouped inspector sections?
    - What public API does it expose (methods, events)?
    - What components does it RequireComponent?

    **Which story needs a class spec?**

  code-prompt-unity: |
    # 🤖 Unity Code Generation Prompt

    ## Template

    ```
    You are implementing a single story from a larger Unity 6 project.

    ## Project Context

    - **Engine:** Unity 6 (C#, .NET Standard 2.1)
    - **Render pipeline:** [URP | HDRP | Built-in]
    - **Game:** [Project name]

    ## Story

    [Paste the story]

    ## Existing Structure

    - Assets/_Project/Scripts/Gameplay/ — component scripts
    - Assets/_Project/Scripts/Data/ — ScriptableObject definitions
    - Assets/_Project/ScriptableObjects/ — SO asset instances
    - Assets/_Project/Prefabs/

    ## What to produce

    1. One new C# file: [path]
    2. Class must extend: [MonoBehaviour | ScriptableObject | base class]
    3. Namespace: Game.[Gameplay | UI | Data]
    4. Serialized fields: [list with [Header] grouping]
    5. Public methods: [list with signatures]
    6. Events: [list]

    ## Rules

    - private [SerializeField] over public for tunables
    - Cache all GetComponent<T>() calls in Awake()
    - Never call Find/FindObjectOfType at runtime
    - No allocations in Update() / FixedUpdate()
    - XML /// docs on public members
    - One class per file

    ## Reject if

    - You use `public float speed;` instead of `[SerializeField] private float speed;`
    - You call `GetComponent<T>()` in Update
    - You use LINQ on a collection in a hot path
    - You use Coroutines where async/await or Unity.Collections would fit better

    ## Output format

    The full .cs file, with no prose before or after.
    ```

    **Which story do you want a prompt for?**

  perf-review: |
    # 🚀 Performance Review Checklist

    ## Allocations

    - [ ] No `new` keyword in Update/FixedUpdate for reference types
    - [ ] Strings built with `StringBuilder`, not `+=`
    - [ ] Collections reused, not re-created
    - [ ] Event handlers unsubscribed in OnDisable/OnDestroy

    ## Unity Calls

    - [ ] No `FindObjectOfType` / `GameObject.Find` at runtime
    - [ ] `GetComponent<T>` cached in Awake/Start
    - [ ] `Camera.main` cached (it searches the scene each call)
    - [ ] No `transform.position = ...` multiple times per frame
          (cache, mutate, assign back)

    ## Rendering

    - [ ] Batching enabled (static + GPU instancing)
    - [ ] Materials share instances where possible
    - [ ] No `MaterialPropertyBlock` allocations per-frame

    **Paste a script here for me to review.**
