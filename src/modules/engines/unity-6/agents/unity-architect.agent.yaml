actions:
  unity-architecture: |
    # 🏗️ Unity 6 Architecture

    ## High-Level Layout

    ```
    Assets/
    ├── _Project/             (game-specific; leading underscore sorts to top)
    │   ├── Scripts/
    │   │   ├── Core/         (shared systems: save, audio, input)
    │   │   ├── Gameplay/     (characters, enemies, pickups)
    │   │   ├── UI/
    │   │   └── Data/         (ScriptableObject definitions)
    │   ├── Prefabs/
    │   ├── ScriptableObjects/
    │   └── Scenes/
    ├── Settings/             (URP/HDRP assets, input maps)
    └── Plugins/              (3rd-party)
    ```

    ## Core Patterns

    1. **Event channels** — `GameEventSO` + `GameEventListener` components
    2. **ScriptableObject configs** — `EnemyDataSO`, `WeaponDataSO`, etc.
    3. **Scene as a responsibility** — Persistent, Gameplay, UI scenes loaded additively
    4. **Service locator (if needed)** — prefer interface-based DI

    **Describe your game loop and I'll sketch the architecture.**

  scene-strategy: |
    # 🎬 Scene Strategy

    ## Recommended Structure

    **Persistent scene (always loaded):**
    - Game manager, audio manager, persistent UI

    **Gameplay scenes (swapped):**
    - Level01, Level02, ... or ProceduralLevel

    **UI scenes (additive):**
    - MainMenu, PauseMenu, OptionsScreen

    Load with `SceneManager.LoadSceneAsync(name, LoadSceneMode.Additive)`.

    ## Why additive

    - Keep global systems alive across level transitions
    - Let level art be loaded/unloaded without losing audio or save state
    - Enable gameplay while UI loads (and vice versa)

    **What scenes does your game need?**

  so-architecture: |
    # 💎 ScriptableObject Architecture

    ## Three Classes of SO

    ### 1. Data SO — content definitions
    ```csharp
    [CreateAssetMenu(menuName = "Game/Enemy Data")]
    public class EnemyDataSO : ScriptableObject {
        public string displayName;
        public int maxHealth = 100;
        public float moveSpeed = 3f;
        public Sprite portrait;
    }
    ```

    ### 2. Event SO — cross-system events
    ```csharp
    [CreateAssetMenu(menuName = "Events/Game Event")]
    public class GameEventSO : ScriptableObject {
        private readonly List<GameEventListener> _listeners = new();
        public void Raise() { ... }
        public void Register(GameEventListener l) { ... }
    }
    ```

    ### 3. Variable SO — shared runtime state
    ```csharp
    [CreateAssetMenu(menuName = "Variables/Int Variable")]
    public class IntVariableSO : ScriptableObject {
        public int value;
    }
    ```

    ## Why SO over singleton

    - Designers can create instances as assets
    - No scene-load lifetime issues
    - Easy to swap in tests (drag a different SO)

    **Which patterns do you want to adopt?**

  render-pipeline: |
    # 🎨 Render Pipeline Recommendation

    ## Decision Tree

    **2D or low-fi stylized 3D?** → **URP**
    - Mobile-friendly, cross-platform
    - Good default for indie / small studio

    **Photoreal 3D, AAA visuals, heavy post-processing?** → **HDRP**
    - PC / next-gen console only
    - Large asset sizes

    **Legacy project or plugins that require it?** → **Built-in**
    - Avoid for new projects

    ## URP Tips
    - Use Renderer Features instead of custom passes when possible
    - Enable GPU instancing on materials
    - 2D Renderer for 2D games (separate from standard URP)

    **Which pipeline fits your project?**
