actions:
  engine-review-unity: |
    # 🔍 Unity Engine Spec Review

    ## Review Checklist

    ### Scene & Prefab Architecture
    - [ ] Additive scene strategy documented
    - [ ] Prefab variants mapped per entity family
    - [ ] Addressables groups defined for content

    ### Script Specifications
    - [ ] Every story names a `.cs` file path
    - [ ] Namespaces defined (Game.Gameplay / UI / Data)
    - [ ] RequireComponent attributes noted
    - [ ] SerializeField vs. public clarified

    ### Implementation Readiness
    - [ ] Dependencies clear
    - [ ] Implementation order defined
    - [ ] LLM prompts prepared (code-prompt-unity)

    **What needs review?**

  story-tech-spec-unity: |
    # 📋 Story Technical Specification (Unity)

    ## Tech Spec Template

    ```yaml
    Story: GDKS-XXX
    Title: [Story title]

    Scripts Required:
      - Assets/_Project/Scripts/Gameplay/Player.cs: MonoBehaviour
      - Assets/_Project/Scripts/Data/PlayerDataSO.cs: ScriptableObject

    Prefabs Required:
      - Assets/_Project/Prefabs/Player.prefab
      - Assets/_Project/Prefabs/HurtBox.prefab (nested)

    ScriptableObject Assets:
      - Assets/_Project/ScriptableObjects/PlayerData.asset (PlayerDataSO)

    Events/Signals:
      - Player.HealthChanged event → UI.HealthBar.OnHealthChanged
      - OnPlayerDeath GameEventSO → GameManager.HandleGameOver

    Implementation Steps:
      1. Create PlayerDataSO class
      2. Create PlayerData asset with tuning values
      3. Create Player.cs MonoBehaviour
      4. Create Player.prefab with Rigidbody2D + Collider
      5. Wire events

    Testing:
      - Drop Player.prefab into a test scene
      - Verify movement, damage, death
      - Verify UI updates when health changes

    Dependencies:
      - PlayerDataSO asset must exist before prefab is created
      - OnPlayerDeath GameEventSO must exist before wiring
    ```

    **Which story needs a tech spec?**

  engine-checklist-unity: |
    # ✅ Engine Phase Checklist (Unity)

    ## Documents
    - [ ] unity-architecture.md
    - [ ] prefab-specifications/
    - [ ] csharp-specifications/
    - [ ] so-inventory.md (list of ScriptableObjects needed)
    - [ ] addressables-plan.md
    - [ ] llm-prompts/

    ## Quality
    - [ ] All stories have tech specs
    - [ ] LLM prompts are complete
    - [ ] Implementation order defined
    - [ ] Performance patterns noted per script

    ## Readiness
    - [ ] First story can be implemented
    - [ ] Project has URP/HDRP/Built-in decision made
    - [ ] Assembly Definitions planned (if using)
    - [ ] Team understands prefab variant choices

    **What's your status?**
