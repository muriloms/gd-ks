actions:
  whatif-exercise: |
    # 🤔 What-If Creative Exercise
    
    Let's break assumptions and explore wild possibilities!
    
    ## The Exercise
    
    Answer these prompts - go with your gut, don't overthink:
    
    1. **What if your game had NO combat/conflict?**
       - What would drive the player forward?
    
    2. **What if the player was the villain?**
       - Or the sidekick? Or an inanimate object?
    
    3. **What if [Genre A] met [Genre B]?**
       - Racing + Horror? Puzzle + Dating Sim? FPS + Cooking?
    
    4. **What if the main verb was [unexpected action]?**
       - Instead of "shoot" → "listen"? Instead of "build" → "destroy"?
    
    5. **What if it was set in [unexpected time/place]?**
       - Medieval cyberpunk? Microscopic world? Inside a computer?
    
    6. **What if you could only use ONE button?**
       - What game emerges from that constraint?
    
    ## Now Pick One!
    
    Which answer excited you most? Let's explore that direction!
    
    *Tell me which scenario sparked something, and we'll dig deeper.* ⚡
  
  elevator-pitch: |
    # 🎤 Elevator Pitch Builder
    
    Let's distill your game into a compelling 30-second pitch!
    
    ## The Template
    
    Fill in the blanks:
    
    ```
    [GAME NAME] is a [GENRE] game where you play as [PROTAGONIST]
    who must [CORE ACTION/GOAL] in a world where [UNIQUE SETTING/TWIST].
    
    The core gameplay loop is [VERB] → [VERB] → [REWARD/PROGRESS].
    
    Unlike [COMPARABLE GAME], our game [KEY DIFFERENTIATOR].
    
    Players will feel [PRIMARY EMOTION] when they [KEY MOMENT].
    ```
    
    ## Examples
    
    **Hades:** "A roguelike where you play as Zagreus, son of Hades, 
    fighting to escape the Underworld. Unlike other roguelikes, 
    death advances the story and relationships. Players feel 
    triumphant mastery AND narrative satisfaction."
    
    **Stardew Valley:** "A farming sim where you inherit a rundown farm
    and must restore it while building relationships in a small town.
    Unlike Harvest Moon, it adds combat, deep crafting, and tackles
    themes of burnout and finding meaning."
    
    ## Let's Build Yours!
    
    *Start with any part you know, and we'll fill in the rest together.* 🎯
  
  genre-mashup: |
    # 🎲 Genre Mashup Exercise
    
    The best innovations come from unexpected combinations!
    
    ## Pick Two (or more!)
    
    **Column A - Base Genre:**
    - Platformer
    - RPG
    - Shooter
    - Puzzle
    - Strategy
    - Racing
    - Fighting
    - Simulation
    
    **Column B - Flavor Genre:**
    - Horror
    - Romance/Dating
    - Mystery
    - Sports
    - Music/Rhythm
    - Cooking
    - Farming
    - Political
    
    **Column C - Wild Card:**
    - Time manipulation
    - Body horror
    - Capitalism critique
    - Found footage
    - Unreliable narrator
    - Fourth wall breaking
    - Permadeath with inheritance
    - Asymmetric multiplayer
    
    ## Famous Mashups
    
    - **Puzzle + Horror** = The Witness meets psychological dread
    - **Farming + Combat + Story** = Stardew Valley
    - **Roguelike + Dating** = Hades
    - **Racing + Battle Royale** = Fall Guys
    - **Deckbuilder + RPG** = Slay the Spire
    
    ## Your Turn!
    
    *Pick 2-3 elements and tell me - I'll help explore what game emerges!* 🎰
  
  core-fantasy: |
    # 👑 Core Fantasy Definition
    
    Every great game fulfills a fantasy - who does the player BECOME?
    
    ## The Question
    
    Complete this sentence:
    **"In my game, the player gets to be _______________"**
    
    ## Examples of Core Fantasies
    
    | Game | Core Fantasy |
    |------|--------------|
    | God of War | An unstoppable warrior god seeking redemption |
    | Stardew Valley | Someone who escapes corporate life for simple fulfillment |
    | Portal | The smartest person in the room who outsmarts AI |
    | Dark Souls | A determined hero who overcomes impossible odds |
    | Animal Crossing | A beloved community member building paradise |
    | Civilization | A god-like ruler shaping human history |
    | Untitled Goose Game | A chaotic agent of mischief |
    
    ## Dig Deeper
    
    1. **What POWER does the player have?** (strength, knowledge, influence)
    2. **What ROLE do they play?** (hero, villain, observer, creator)
    3. **What EMOTION do they feel?** (powerful, clever, nurturing, chaotic)
    4. **What WORLD do they inhabit?** (dangerous, cozy, mysterious, competitive)
    
    *Tell me about your player's fantasy, and we'll refine it together!* 👑
  
  defining-moments: |
    # 📸 Defining Moments
    
    What are the "screenshot moments" that would sell your game?
    
    ## The Exercise
    
    Imagine 5 screenshots/GIFs on your Steam page. Describe them:
    
    1. **The Hook Shot** - First impression, "what IS this game?"
    2. **The Action Shot** - Core gameplay in motion
    3. **The Beauty Shot** - Most visually impressive moment
    4. **The Emotional Shot** - Story/character moment that resonates
    5. **The Mastery Shot** - Late-game skill/content that says "there's depth here"
    
    ## Examples
    
    **Hollow Knight:**
    1. Hook: Tiny knight facing massive boss in dark cavern
    2. Action: Fluid combat with nail-bouncing on enemy
    3. Beauty: Bioluminescent mushroom forest
    4. Emotional: Sitting with Quirrel at Blue Lake
    5. Mastery: Pantheon boss rush completion
    
    **Celeste:**
    1. Hook: Madeline clinging to mountain face
    2. Action: Precision dash through spike maze
    3. Beauty: Summit view at sunset
    4. Emotional: Mirror temple confrontation
    5. Mastery: Golden strawberry collection
    
    ## Your Moments
    
    *Describe even rough ideas - we'll refine them into selling points!* 📸
  
  handoff-to-team: |
    # 📤 Ready for Handoff
    
    Great work on the concept! Here's where we are and where to go next:
    
    ## Checklist Before Handoff
    
    - [ ] Core concept is clear and exciting
    - [ ] Unique hook identified
    - [ ] Core fantasy defined
    - [ ] Basic scope understood
    - [ ] Elevator pitch crafted
    - [ ] Key moments visualized
    
    ## Document Status
    
    Your concept brief should be saved at:
    `_gdks-output/01-ideation/concept-brief.md`
    
    ## Next Steps
    
    1. **Market Analysis** → Talk to `@market-analyst` (Marcus)
       - Run `*market-research` to validate market fit
    
    2. **Mechanics Deep Dive** → Talk to `@mechanics-explorer` (Mira)  
       - Run `*explore-mechanics` to detail core loops
    
    3. **Team Synthesis** → Talk to `@ideation-coordinator` (Ivy)
       - Run `*synthesize` to prepare for Design Team
    
    ## When to Move to Design Team
    
    Once you have:
    - ✅ concept-brief.md
    - ✅ market-analysis.md  
    - ✅ mechanics-exploration.md
    - ✅ ideation-handoff.md
    
    Then proceed to Design Team with `@game-design-director` (Diana)!
    
    *Which specialist would you like to talk to next?* 🚀
