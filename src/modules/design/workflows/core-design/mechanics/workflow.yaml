name: core-mechanics
description: Define and document core and secondary game mechanics
version: 1.0.0
module: design
phase: 2

metadata:
  display_name: 'Core Mechanics'
  icon: '⚙️'
  time_estimate: '60-90 minutes'
  difficulty: 'intermediate'
  output_path: '_gdks-output/02-design/core-design/mechanics/'

agents:
  primary: mechanics-designer
  support:
    - game-design-director
    - core-loop-specialist

inputs:
  required:
    - concept-brief.md
    - design-pillars.md
  optional:
    - gameplay-loops.md

outputs:
  - mechanics/core-mechanics.md
  - mechanics/secondary-mechanics.md
  - mechanics/input-mapping.md

steps:
  - id: core-verb
    name: 'Define Core Verb'
    type: prompt
    description: 'What is the primary action players repeat?'
    
  - id: secondary-verbs
    name: 'Secondary Mechanics'
    type: prompt
    description: 'What actions add depth to the core?'
    
  - id: interactions
    name: 'Mechanic Interactions'
    type: prompt
    description: 'How do mechanics combine and interact?'
    
  - id: inputs
    name: 'Input Mapping'
    type: prompt
    description: 'How do players execute these actions?'
    
  - id: feedback
    name: 'Action Feedback'
    type: prompt
    description: 'What feedback confirms each action?'
    
  - id: document
    name: 'Generate Mechanics Spec'
    type: template
