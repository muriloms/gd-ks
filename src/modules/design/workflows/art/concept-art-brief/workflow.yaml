name: concept-art-brief
description: Create detailed briefs for concept art production
version: 1.0.0
module: design
phase: 2
metadata:
  display_name: "Concept Art Brief"
  icon: "🖼️"
  time_estimate: "20-30 minutes per brief"
  output_path: "_gdks-output/02-design/art/concept-briefs/"
agents:
  primary: concept-artist
  support:
    - art-director
outputs:
  - concept-briefs/[subject].md
steps:
  - id: subject
    name: "Define Subject"
    type: prompt
  - id: requirements
    name: "Visual Requirements"
    type: prompt
  - id: references
    name: "References"
    type: prompt
  - id: specs
    name: "Technical Specs"
    type: prompt
  - id: document
    name: "Generate Brief"
    type: template
