actions:
  moodboard-creation: |
    # 📋 Mood Board Creation
    
    Collect visual references that communicate your vision!
    
    ## Mood Board Structure
    
    ```yaml
    Subject: [What this mood board is for]
    Purpose: [Character/Environment/UI/Overall Style]
    
    Categories:
      Color Palette:
        Primary Colors: [Main colors]
        Secondary Colors: [Accent colors]
        Mood: [Warm/Cold/Neutral/Mixed]
        
      Style References:
        - Reference: [Game/Movie/Art piece]
          What to Use: [Specific element]
          What to Avoid: [What NOT to take]
          
      Texture & Material:
        Surface Feel: [Rough/Smooth/Organic/Industrial]
        Material Focus: [Stone/Metal/Wood/Fabric/etc]
        
      Lighting Mood:
        Primary Light: [Source and quality]
        Atmosphere: [Clear/Foggy/Dusty/etc]
        Time of Day: [If applicable]
        
      Compositional Style:
        Shapes: [Geometric/Organic/Angular/Curved]
        Density: [Busy/Minimal/Balanced]
        Focus: [Centered/Dynamic/Panoramic]
    ```
    
    ## Reference Description Template
    
    For each reference image/video:
    ```
    Source: [Where it's from]
    URL/Description: [How to find it]
    Use This: [What element to borrow]
    Ignore This: [What to NOT use]
    Priority: [Must-have/Nice-to-have/Inspiration only]
    ```
    
    **What visual mood are you going for?**
  
  color-script: |
    # 🌈 Color Script
    
    How color tells your story!
    
    ## Color Script Document
    
    ### Overall Palette
    
    | Role | Color | Hex | Usage |
    |------|-------|-----|-------|
    | Primary | [Name] | #XXXXXX | [When used] |
    | Secondary | [Name] | #XXXXXX | [When used] |
    | Accent | [Name] | #XXXXXX | [When used] |
    | Danger | [Name] | #XXXXXX | [When used] |
    | Safe | [Name] | #XXXXXX | [When used] |
    
    ### Emotional Mapping
    
    | Emotion/State | Colors | Example Scene |
    |---------------|--------|---------------|
    | Joy/Victory | [Warm, bright] | [Specific moment] |
    | Danger/Fear | [Reds, darks] | [Specific moment] |
    | Mystery | [Cool, muted] | [Specific moment] |
    | Peace/Safety | [Soft, natural] | [Specific moment] |
    
    ### Location Color Keys
    
    | Location | Dominant Color | Accent | Mood |
    |----------|---------------|--------|------|
    | [Area 1] | [Color] | [Color] | [Feel] |
    | [Area 2] | [Color] | [Color] | [Feel] |
    
    ### Progression
    
    ```
    Act 1: [Color scheme] → [Mood]
    Act 2: [Color scheme] → [Mood]  
    Act 3: [Color scheme] → [Mood]
    ```
    
    **How does color tell your story?**
  
  prop-design: |
    # 🗡️ Prop & Item Design
    
    Objects that populate your world!
    
    ## Prop Brief Template
    
    ```yaml
    Item Name: [Name]
    Category: [Weapon/Tool/Consumable/Key Item/Decoration]
    
    Function:
      Gameplay Purpose: [What it does mechanically]
      Story Purpose: [What it means narratively]
      Rarity: [Common/Uncommon/Rare/Unique]
    
    Visual Design:
      Size: [Relative scale]
      Shape Language: [Curves/Angles/Mixed]
      Material: [What it's made of]
      Condition: [New/Worn/Ancient/Magical]
      
    Style Alignment:
      Era: [Historical reference]
      Culture: [If faction/region specific]
      Style Guide: [Which art bible section]
      
    Visual Requirements:
      - [Specific requirement 1]
      - [Specific requirement 2]
      
    References:
      Similar Items: [Real-world or game references]
      Avoid: [What NOT to do]
      
    Technical:
      Views Needed: [Front/Side/Detail/In-use]
      Variations: [Color/damage/upgrade states]
      Animation Needs: [If any moving parts]
    ```
    
    ## Prop Categories
    
    | Category | Examples | Priority |
    |----------|----------|----------|
    | Hero Props | Protagonist's sword, key items | High |
    | Weapons | Swords, guns, tools | High |
    | Consumables | Potions, food, ammo | Medium |
    | Environment | Furniture, containers | Medium |
    | Collectibles | Treasures, lore items | Low-Medium |
    
    **What key props need design?**
