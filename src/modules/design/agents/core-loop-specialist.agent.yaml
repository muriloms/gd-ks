actions:
  micro-loop: |
    # ⚡ Micro Loop (Second-to-Second)
    
    The tightest gameplay cycle - instant satisfaction!
    
    ## Classic Micro Loop
    
    ```
    ┌─────────────────────────────────────┐
    │         MICRO LOOP (~1-5 sec)       │
    │                                     │
    │    ┌──────┐    ┌──────┐            │
    │    │ See  │───▶│ React│            │
    │    └──────┘    └──────┘            │
    │        ▲           │               │
    │        │           ▼               │
    │    ┌──────┐    ┌──────┐            │
    │    │Result│◀───│Execute│           │
    │    └──────┘    └──────┘            │
    │                                     │
    └─────────────────────────────────────┘
    ```
    
    ## Examples by Genre
    
    | Genre | See | React | Execute | Result |
    |-------|-----|-------|---------|--------|
    | Shooter | Enemy | Aim | Shoot | Kill/Miss |
    | Platformer | Gap | Time | Jump | Land/Fall |
    | Puzzle | Pattern | Plan | Match | Clear/Fail |
    | Racing | Turn | Steer | Drift | Fast/Crash |
    
    ## Micro Loop Template
    
    ```yaml
    Game: [Your Game]
    
    Micro Loop:
      Duration: [Seconds]
      
      Stimulus:
        What Player Sees: [Visual cue]
        When It Appears: [Trigger]
        
      Decision:
        Options: [What player can do]
        Time Pressure: [Reaction time needed]
        
      Action:
        Input: [Button/control]
        Execution Window: [Timing requirement]
        
      Feedback:
        Success: [Visual + Audio + Feel]
        Failure: [Visual + Audio + Feel]
        
      Reset:
        Time to Next Stimulus: [Seconds]
    ```
    
    **What's your second-to-second loop?**
  
  meta-loop: |
    # 📊 Meta Loop (Session-to-Session)
    
    Why players come BACK tomorrow!
    
    ## Meta Loop Structure
    
    ```
    SESSION 1                    SESSION 2
    ┌──────────────┐             ┌──────────────┐
    │ Play         │             │ Play         │
    │    ↓         │             │    ↓         │
    │ Earn         │────────────▶│ Use Rewards  │
    │    ↓         │             │    ↓         │
    │ Progress     │             │ Progress     │
    │    ↓         │             │    ↓         │
    │ Preview Next │             │ Preview Next │
    └──────────────┘             └──────────────┘
    ```
    
    ## Meta Loop Elements
    
    | Element | Purpose | Example |
    |---------|---------|---------|
    | **Save State** | Preserve progress | Level, items, stats |
    | **Daily Rewards** | Incentivize return | Login bonuses |
    | **Unfinished Goals** | Create anticipation | "Almost got it!" |
    | **New Content** | Promise novelty | Daily challenges |
    | **Social Hooks** | External motivation | "Friend beat your score" |
    
    ## Session Endpoints
    
    ```yaml
    Ideal Session End:
      Achievement: [What player just accomplished]
      Tease: [What's coming next]
      Save: [Progress preserved]
      
    Hook for Return:
      Short-term: [What to do next session]
      Long-term: [Ultimate goal visible]
    ```
    
    **What brings players back session after session?**
  
  feedback-loop: |
    # 📢 Feedback Loop
    
    Closing the action-reaction cycle!
    
    ## Feedback Timing
    
    | Timing | Player Feel | Use For |
    |--------|-------------|---------|
    | 0-50ms | Instant | Core actions |
    | 50-150ms | Responsive | Complex actions |
    | 150-300ms | Deliberate | Heavy/powerful actions |
    | 300ms+ | Weighty | Big impacts |
    
    ## Feedback Channels
    
    ```yaml
    Action: [Player action]
    
    Visual Feedback:
      Immediate: [Frame 1-2 response]
      Sustained: [During action]
      Result: [Outcome shown]
      
    Audio Feedback:
      Start Sound: [Action initiation]
      Loop Sound: [During action]
      End Sound: [Action complete]
      
    Haptic Feedback:
      Vibration Pattern: [Rumble type]
      Intensity: [Light/Medium/Heavy]
      Duration: [ms]
      
    Game State Feedback:
      UI Update: [Numbers, bars, icons]
      World Change: [Environmental response]
      Enemy Reaction: [AI response]
    ```
    
    ## The Feedback Sandwich
    
    ```
    ANTICIPATION → EXECUTION → FOLLOW-THROUGH
    
    Wind-up      →  Impact    →  Recovery
    Charge sound →  Hit sound →  Echo/Decay
    Pull back    →  Strike    →  Return
    ```
    
    **Is every action clearly confirmed?**
