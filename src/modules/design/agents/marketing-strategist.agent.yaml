actions:
  quick-pitch: |
    # 🎤 Quick Pitch Development
    
    Distill your game to its essence!
    
    ## Pitch Formats
    
    ### The Tweet (280 chars)
    ```
    [GAME NAME]: [Hook in one compelling sentence]
    ```
    
    ### The Elevator Pitch (30 seconds)
    ```
    [GAME NAME] is a [GENRE] where you [CORE ACTION].
    What makes it special: [UNIQUE HOOK].
    Perfect for fans of [COMPARABLE GAMES].
    ```
    
    ### The Paragraph (Store short description)
    ```
    [Hook sentence that grabs attention]
    [What you do in the game]
    [What makes it unique]
    [Emotional promise]
    ```
    
    ### Comparison Formula
    ```
    "[GAME NAME] is [GAME A] meets [GAME B]"
    or
    "[GAME NAME] is [GAME A] but [UNIQUE TWIST]"
    ```
    
    **Let's craft your pitches!**
  
  audience-analysis: |
    # 🎯 Audience Analysis
    
    Who is your game FOR?
    
    ## Primary Persona
    
    ```yaml
    Name: [Fictional name]
    Age Range: [XX-XX]
    
    Gaming Profile:
      Platform: [PC/Console/Mobile]
      Play Time: [Hours per week]
      Spending: [F2P/Budget/Full price/Collector]
      Discovery: [How they find games]
      
    Favorite Games:
      Recent: [What they're playing]
      All-time: [Their classics]
      Genre Preference: [Main genres]
      
    Motivations:
      Why They Play: [Core driver]
      What They Seek: [Specific experiences]
      What They Avoid: [Turn-offs]
      
    Where to Find Them:
      Social: [Platforms]
      Communities: [Discord/Reddit/Forums]
      Content: [Streamers/YouTubers they watch]
      
    How to Reach Them:
      Message: [What resonates]
      Visuals: [What catches eye]
      Tone: [How to speak to them]
    ```
    
    ## Secondary Personas
    
    [Repeat for 1-2 more audience segments]
    
    **Who is your ideal player?**
  
  competitor-scan: |
    # 🔍 Competitor Analysis
    
    Know your market position!
    
    ## Competitor Template
    
    ```yaml
    Game: [Name]
    Release: [Date]
    Platform: [Where available]
    Price: [Cost]
    
    Performance:
      Reviews: [Score/sentiment]
      Sales Est: [If known]
      Active Players: [If available]
      
    What They Do Well:
      - [Strength 1]
      - [Strength 2]
      
    What They Lack:
      - [Weakness 1]
      - [Weakness 2]
      
    Their Audience:
      Who Plays: [Description]
      Why: [Appeal factors]
      
    Marketing Approach:
      Positioning: [How they sell it]
      Channels: [Where they market]
      Messaging: [Key messages]
    ```
    
    ## Your Differentiation
    
    | Competitor | They Have | You Have Instead |
    |------------|-----------|------------------|
    | [Game A] | [Feature] | [Your approach] |
    | [Game B] | [Feature] | [Your approach] |
    
    **Who are your competitors?**
  
  content-calendar: |
    # 📅 Content Calendar
    
    Plan your marketing beats!
    
    ## Pre-Launch Timeline
    
    | Phase | Timing | Goals | Content |
    |-------|--------|-------|---------|
    | Announcement | -6 months | Awareness | Reveal trailer, press |
    | Build Hype | -3 months | Wishlists | Dev logs, screenshots |
    | Demo/Beta | -1 month | Engagement | Playable, streams |
    | Launch Week | Week 0 | Conversion | Launch trailer, reviews |
    | Post-Launch | +1 month | Retention | Updates, community |
    
    ## Weekly Content Plan
    
    | Day | Platform | Content Type | Example |
    |-----|----------|--------------|---------|
    | Mon | Twitter | Dev update | "Working on [feature]" |
    | Wed | Discord | Community | Q&A, polls |
    | Fri | YouTube | Visual | Screenshot, GIF |
    | Sat | Reddit | Discussion | Dev diary post |
    
    ## Key Milestones
    
    - [ ] Announce date
    - [ ] Trailer #1 (Reveal)
    - [ ] Steam page live
    - [ ] Demo available
    - [ ] Trailer #2 (Launch)
    - [ ] Reviews embargo
    - [ ] Launch day
    
    **When are your key dates?**
