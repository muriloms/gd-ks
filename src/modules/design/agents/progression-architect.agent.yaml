actions:
  reward-design: |
    # 🎁 Reward Design
    
    The psychology of keeping players engaged!
    
    ## Reward Types
    
    | Type | Description | Retention Value |
    |------|-------------|-----------------|
    | **Power** | Make player stronger | High (short-term) |
    | **Content** | New areas, modes | High (novelty) |
    | **Cosmetic** | Visual customization | Medium (expression) |
    | **Knowledge** | Lore, story | Low-Medium (invested players) |
    | **Currency** | Spend later | Medium (anticipation) |
    | **Achievement** | Recognition | Low (completionists) |
    
    ## Reward Schedule
    
    ```yaml
    Immediate (0-5 min):
      - XP / Points
      - Small currency drops
      - Combo feedback
      
    Short-term (5-30 min):
      - Level up
      - New ability unlock
      - Equipment drop
      
    Medium-term (1-5 hours):
      - Story milestone
      - New area access
      - Significant upgrade
      
    Long-term (10+ hours):
      - Endgame content
      - Mastery rewards
      - Prestige systems
    ```
    
    ## Reward Spacing
    
    ```
    Time →
    |--●--●--●-----●--------●------------●|
       ^  ^  ^     ^        ^            ^
       Quick wins  Building  Big payoff  Mastery
    ```
    
    **What rewards will drive your players?**
  
  unlock-system: |
    # 🔓 Unlock System
    
    What players earn as they progress!
    
    ## Unlock Categories
    
    ### Ability Unlocks
    ```yaml
    Progression Type: Linear / Branching / Choice
    
    Example Tree:
      Base:
        - Basic Attack
        - Basic Movement
      
      Level 5:
        - Branch A: Dash Attack
        - Branch B: Charged Shot
        
      Level 10:
        - Requires A: Air Dash
        - Requires B: Piercing Shot
    ```
    
    ### Content Unlocks
    ```yaml
    Gating Type: Story / Skill / Time / Collection
    
    Area Progression:
      - Tutorial Zone: Always open
      - Forest: After tutorial
      - Castle: After boss 1
      - Secret Zone: 100% completion
    ```
    
    ### Cosmetic Unlocks
    ```yaml
    Earn Methods:
      - Achievement-based
      - Currency purchase
      - Challenge completion
      - Random drops
      - Seasonal events
    ```
    
    ## Unlock Pacing
    
    | Session | Unlocks Expected | Type |
    |---------|------------------|------|
    | 1st hour | 5-10 | Foundational |
    | Hours 2-5 | 15-20 | Build variety |
    | Hours 5-15 | 10-15 | Specialization |
    | 15+ hours | 5-10 | Mastery/Rare |
    
    **What will players unlock in your game?**
  
  game-economy: |
    # 💰 Game Economy
    
    Resources that flow through your game!
    
    ## Currency Types
    
    | Currency | Earn Rate | Spend On | Purpose |
    |----------|-----------|----------|---------|
    | **Soft** (Gold) | Frequent | Common items | Steady progress |
    | **Hard** (Gems) | Rare | Premium items | Special rewards |
    | **Skill** (XP) | Always | Levels/abilities | Power growth |
    | **Crafting** | Variable | Equipment | Player choice |
    
    ## Economy Balance Template
    
    ```yaml
    Currency: [Name]
    
    Sources:
      - Source: [Where earned]
        Rate: [Amount per hour]
        Effort: [Easy/Medium/Hard]
    
    Sinks:
      - Item: [What to buy]
        Cost: [Amount]
        Value: [Why player wants it]
    
    Balance Check:
      Hours to Major Purchase: [Time]
      Feel: [Too slow / Just right / Too fast]
    ```
    
    ## Economy Red Flags
    
    ⚠️ **Warning Signs:**
    - Players hoarding (nothing good to buy)
    - Players broke (sinks too aggressive)
    - Currency feels worthless (too abundant)
    - Must-have items too expensive (pay-to-win feel)
    
    **What resources flow through your game?**
