actions:
  factions-design: |
    # ⚔️ Factions Design
    
    Groups that shape your world!
    
    ## Faction Template
    
    ```yaml
    Faction Name: [Name]
    Type: [Nation/Organization/Cult/Guild/Tribe/Corporation]
    
    Identity:
      Symbol: [Visual identifier]
      Colors: [Associated colors]
      Motto: [Their creed or slogan]
    
    Overview:
      Founded: [When/how they began]
      Territory: [Where they operate]
      Population: [Size/reach]
      Power Level: [Weak/Moderate/Strong/Dominant]
    
    Structure:
      Leadership: [How they're governed]
      Hierarchy: [Ranks/positions]
      Membership: [How to join/leave]
    
    Values:
      Goals: [What they want]
      Methods: [How they achieve it]
      Taboos: [What they forbid]
    
    Relationships:
      Allies: [Who they work with]
      Enemies: [Who they oppose]
      Neutral: [Complicated relationships]
    
    Resources:
      Economic: [Wealth, trade]
      Military: [Forces, weapons]
      Special: [Unique advantages]
    
    Role in Story:
      Player Interaction: [How players engage]
      Story Function: [Ally/enemy/neutral/questgiver]
    ```
    
    **What factions exist in your world?**
  
  world-timeline: |
    # 📅 World Timeline
    
    History shapes the present!
    
    ## Timeline Structure
    
    ### Age/Era Organization
    
    | Era | Name | Duration | Key Events |
    |-----|------|----------|------------|
    | 1 | [Creation/Dawn] | [Years] | [What happened] |
    | 2 | [Golden Age] | [Years] | [What happened] |
    | 3 | [Conflict] | [Years] | [What happened] |
    | 4 | [Current] | [Years] | [What happened] |
    
    ### Major Events Template
    
    ```yaml
    Event: [Name]
    Date: [When]
    Location: [Where]
    
    What Happened:
      Summary: [Brief description]
      Causes: [Why it occurred]
      Key Figures: [Who was involved]
    
    Consequences:
      Immediate: [Short-term effects]
      Long-term: [Lasting impact]
      Present Day: [How it affects NOW]
    
    Evidence:
      Monuments: [Physical reminders]
      Stories: [How it's remembered]
      Artifacts: [Items from this time]
    ```
    
    **What's the history of your world?**
  
  world-rules: |
    # ⚙️ World Rules
    
    The laws that govern your world!
    
    ## Categories
    
    ### Magic System (if applicable)
    
    ```yaml
    Magic:
      Source: [Where does magic come from?]
      Access: [Who can use it? How?]
      Cost: [What's the price?]
      Limits: [What CAN'T magic do?]
      
    Types:
      - Type: [Name]
        Description: [What it does]
        Users: [Who uses it]
        
    Rules:
      - [Hard rule 1]
      - [Hard rule 2]
      - [Soft rule/exception]
    ```
    
    ### Technology Level
    
    - Era equivalent: [Medieval/Renaissance/Industrial/Modern/Future]
    - Notable tech: [What exists]
    - Anachronisms: [What's different from real history]
    - Forbidden tech: [What doesn't exist and why]
    
    ### Physical Laws
    
    - Same as Earth? [Yes/No/Mostly]
    - Differences: [What's different]
    - Implications: [How this affects life]
    
    **What rules govern your world?**
  
  geography: |
    # 🗺️ Geography
    
    The physical world!
    
    ## World Map Structure
    
    ### Regions
    
    | Region | Climate | Terrain | Inhabitants | Resources |
    |--------|---------|---------|-------------|-----------|
    | [Name] | [Type] | [Features] | [Who lives here] | [What's valuable] |
    
    ### Location Types
    
    - **Natural:** Forests, mountains, oceans, deserts
    - **Settlements:** Cities, towns, villages, camps
    - **Dungeons:** Caves, ruins, towers, lairs
    - **Sacred:** Temples, shrines, monuments
    - **Hidden:** Secret areas, lost civilizations
    
    ### Travel Considerations
    
    - How long to travel between regions?
    - What dangers exist on roads?
    - Are there fast travel options?
    - What natural barriers exist?
    
    **Describe your world's geography!**
