actions:
  physics-tuning: |
    # 🎱 Physics Tuning
    
    Making movement feel RIGHT!
    
    ## Movement Variables
    
    ```yaml
    Character Physics:
      
      Horizontal Movement:
        Max Speed: [units/sec]
        Acceleration: [units/sec²]
        Deceleration: [units/sec²]
        Air Control: [% of ground control]
        Turn Speed: [degrees/sec or instant]
      
      Vertical Movement:
        Jump Height: [units]
        Jump Duration: [seconds to apex]
        Gravity: [units/sec²]
        Fall Gravity: [often higher than rise]
        Max Fall Speed: [terminal velocity]
        
      Special:
        Coyote Time: [ms after leaving edge]
        Jump Buffer: [ms before landing]
        Variable Jump: [Yes/No, release early = lower]
    ```
    
    ## Reference Values
    
    | Game | Jump Height | Gravity | Feel |
    |------|-------------|---------|------|
    | Mario | Medium | Low | Floaty, forgiving |
    | Celeste | High | High | Snappy, precise |
    | Dark Souls | Low | High | Weighty, committed |
    | Hollow Knight | Medium | Medium | Balanced, responsive |
    
    ## The Feel Test
    
    ```
    Too Floaty: Slow gravity, no weight
    ────────────●──────────────────────
                     Perfect
    ────────────────────●──────────────
    Too Heavy: Fast gravity, sluggish
    ```
    
    ## Tuning Tips
    
    - **Start with references** - Copy a game that feels right
    - **Separate rise/fall gravity** - Fall faster than rise
    - **Add coyote time** - 80-150ms forgiveness
    - **Use curves, not linear** - Ease in/out
    
    **How should movement FEEL in your game?**
  
  juice-design: |
    # 💥 Juice Design
    
    The secret sauce that makes games satisfying!
    
    ## Juice Categories
    
    | Category | Examples | Purpose |
    |----------|----------|---------|
    | **Screen Effects** | Shake, flash, zoom | Impact |
    | **Particles** | Sparks, dust, blood | Feedback |
    | **Animation** | Squash/stretch, anticipation | Weight |
    | **Audio** | Layered SFX, pitch variation | Confirmation |
    | **Time** | Hit stop, slow-mo | Emphasis |
    | **Camera** | Lerp, trauma, focus | Attention |
    
    ## The Juice Stack
    
    For every impactful action, layer:
    
    ```yaml
    Action: [Player attacks enemy]
    
    Layer 1 - Animation:
      Anticipation: [Wind-up frames]
      Impact: [Contact frame held]
      Follow-through: [Recovery animation]
      
    Layer 2 - Effects:
      Particles: [Slash effect, sparks]
      Flash: [White frame on hit]
      Trail: [Motion blur/ghost]
      
    Layer 3 - Screen:
      Shake: [Intensity, duration]
      Zoom: [Punch in on impact]
      
    Layer 4 - Time:
      Hit Stop: [Freeze frames, ms]
      Slow Motion: [%, duration]
      
    Layer 5 - Audio:
      Attack Sound: [Whoosh]
      Impact Sound: [Thud/slash]
      Enemy Reaction: [Pain sound]
      
    Layer 6 - World:
      Knockback: [Enemy pushed]
      Damage Numbers: [If applicable]
      Blood/Debris: [Environmental]
    ```
    
    ## Juice Intensity Scale
    
    | Action Type | Juice Level | Example |
    |-------------|-------------|---------|
    | Common action | Low | Basic attack |
    | Significant hit | Medium | Critical hit |
    | Major moment | High | Boss kill |
    | Climax | Maximum | Final blow |
    
    **What moments need the most juice?**
  
  responsiveness: |
    # ⚡ Responsiveness
    
    The gap between input and action!
    
    ## Input Latency Budget
    
    ```
    Player Input
         │
         ▼ (< 16ms ideal)
    Game Receives Input
         │
         ▼ (< 1 frame)
    Animation Starts
         │
         ▼ (< 50ms total)
    Feedback Visible
    ```
    
    ## Response Time Guidelines
    
    | Action | Max Latency | Notes |
    |--------|-------------|-------|
    | Movement | < 50ms | Must feel instant |
    | Jump | < 67ms | Can be 1-2 frames |
    | Attack | < 100ms | Wind-up helps mask |
    | Heavy attack | < 150ms | Anticipation expected |
    | Menu/UI | < 100ms | Snappy |
    
    ## Animation Canceling
    
    ```yaml
    Action: [Name]
    
    Cancel Windows:
      Into Dodge: [Frame range]
      Into Jump: [Frame range]
      Into Attack: [Frame range]
      Into Block: [Frame range]
      
    Cannot Cancel:
      Recovery: [Committed frames]
      Startup: [If any]
    ```
    
    ## Responsiveness Tricks
    
    | Technique | Effect | Example |
    |-----------|--------|---------|
    | **Input Buffer** | Queue next action | Attack queued during recovery |
    | **Animation Cancel** | Interrupt for response | Dodge cancels attack |
    | **Instant Startup** | First frame moves | Movement starts frame 1 |
    | **Anticipation Cut** | Remove wind-up | Dash has no telegraph |
    | **Coyote Time** | Late input forgiveness | Jump after leaving edge |
    
    ## The Response Test
    
    ```
    Ask: "When I press the button, does the 
         character do what I want IMMEDIATELY?"
    
    If No: Find the delay and eliminate it
    If Yes: The feel is responsive
    ```
    
    **Does your game respond instantly to player input?**
