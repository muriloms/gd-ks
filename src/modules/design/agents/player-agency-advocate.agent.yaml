actions:
  choice-design: |
    # ⚖️ Choice Design
    
    Creating decisions that MATTER!
    
    ## Choice Quality Spectrum
    
    ```
    MEANINGLESS ◄─────────────────────────► MEANINGFUL
    
    "Red or blue?"     "Sword or magic?"     "Save friend or
     (cosmetic only)    (different gameplay)   save village?"
    ```
    
    ## Meaningful Choice Criteria
    
    ✅ A choice is meaningful when:
    - Both options are viable
    - The decision creates tension
    - Consequences are visible
    - It reflects player values/style
    - There's no obviously "correct" answer
    
    ## Choice Template
    
    ```yaml
    Choice: [Name/Description]
    
    Context: [When does player face this?]
    
    Options:
      Option A:
        Description: [What player does]
        Appeal: [Why choose this?]
        Cost: [What you give up]
        
      Option B:
        Description: [What player does]
        Appeal: [Why choose this?]
        Cost: [What you give up]
    
    Balance Check:
      Both Viable: [Yes/No]
      Tension: [Low/Medium/High]
      Reversible: [Yes/No/Partially]
    
    Consequence:
      Immediate: [What happens now]
      Long-term: [What happens later]
      Visible: [Can player see impact?]
    ```
    
    ## Choice Types
    
    | Type | Example | Tension Source |
    |------|---------|----------------|
    | Resource | Spend gold on X or Y? | Scarcity |
    | Strategic | Stealth or combat? | Playstyle |
    | Moral | Help A or B? | Values |
    | Risk | Safe path or shortcut? | Risk/reward |
    | Commitment | Specialize or generalize? | Identity |
    
    **What meaningful choices does your game offer?**
  
  build-diversity: |
    # 🎮 Build Diversity
    
    Let players express themselves through gameplay!
    
    ## Build Diversity Health Check
    
    ```yaml
    Question: Can players beat the game in meaningfully 
              different ways?
    
    Healthy Signs:
      ✅ Multiple viable builds for endgame
      ✅ Players debate "best" build (no consensus)
      ✅ Content creators showcase different styles
      ✅ "Off-meta" builds can succeed
      
    Unhealthy Signs:
      ❌ One "correct" build
      ❌ Most options are traps
      ❌ Respec is mandatory
      ❌ Build diversity only in early game
    ```
    
    ## Playstyle Archetypes
    
    ```yaml
    Archetype: [Name]
    
    Fantasy: [What player feels like]
    Strengths: [Where they excel]
    Weaknesses: [Where they struggle]
    
    Core Stats/Skills:
      - [Priority 1]
      - [Priority 2]
      
    Supported By:
      Mechanics: [What mechanics enable this?]
      Items: [What gear supports this?]
      Levels: [What content favors this?]
    ```
    
    ## Build Balance Matrix
    
    | Build | Combat | Exploration | Puzzle | Social |
    |-------|--------|-------------|--------|--------|
    | Warrior | ⭐⭐⭐ | ⭐⭐ | ⭐ | ⭐ |
    | Mage | ⭐⭐ | ⭐⭐ | ⭐⭐⭐ | ⭐ |
    | Rogue | ⭐⭐ | ⭐⭐⭐ | ⭐⭐ | ⭐⭐ |
    | Bard | ⭐ | ⭐⭐ | ⭐⭐ | ⭐⭐⭐ |
    
    **What playstyles can players pursue?**
  
  consequence-design: |
    # 📊 Consequence Design
    
    Choices without consequences are illusions!
    
    ## Consequence Visibility
    
    | Timing | Visibility | Player Feel |
    |--------|------------|-------------|
    | Immediate | High | Satisfying |
    | Delayed | Medium | Anticipation |
    | Hidden | Low | Surprise (good or bad) |
    | Never | None | Disappointed |
    
    ## Consequence Template
    
    ```yaml
    Choice Made: [What player chose]
    
    Immediate Consequence:
      What Happens: [Description]
      Player Sees: [Visual feedback]
      Player Hears: [Audio feedback]
      
    Short-term Consequence:
      What Changes: [Description]
      When Visible: [Time/trigger]
      
    Long-term Consequence:
      What Changes: [Description]
      When Visible: [Time/trigger]
      Callback: [Does game reference the choice?]
    ```
    
    ## Consequence Checklist
    
    For every major choice:
    - [ ] Is there immediate feedback?
    - [ ] Does something change in the game world?
    - [ ] Will the player see the impact?
    - [ ] Is the consequence proportional to the choice?
    - [ ] Are there callbacks later?
    
    ## The Consequence Web
    
    ```
    Choice A ──────────┬────────────────▶ Ending X
                       │
                       ├──▶ NPC reacts
                       │
                       └──▶ Area changes
                              │
                              └──▶ Quest available
    ```
    
    **Do your choices have visible consequences?**
