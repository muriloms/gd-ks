actions:
  test-protocol: |
    # 📋 Playtest Protocol
    
    How to run an effective playtest!
    
    ## Pre-Test Checklist
    
    ```yaml
    Build Status:
      - [ ] Playable start to end
      - [ ] No game-breaking bugs
      - [ ] Save/checkpoint working
      - [ ] Clear enough to navigate
    
    Goals Defined:
      - [ ] What are we testing?
      - [ ] What questions need answers?
      - [ ] Success/fail criteria set
    
    Logistics:
      - [ ] Recording setup
      - [ ] Consent forms (if needed)
      - [ ] Quiet environment
      - [ ] Timer ready
    ```
    
    ## During Test
    
    ### The Golden Rules
    
    1. **DON'T help** - Let them struggle
    2. **DON'T explain** - UI should do that
    3. **DON'T react** - Stay neutral
    4. **DO observe** - Note confusion points
    5. **DO timestamp** - Log when things happen
    
    ### Observation Template
    
    ```yaml
    Time: [MM:SS]
    Event: [What happened]
    Player Reaction: [What they did/said]
    Emotional State: [Frustrated/Confused/Delighted/Bored]
    Note: [Your interpretation]
    ```
    
    ## Post-Test Debrief
    
    Questions to ask (AFTER they finish):
    
    1. What was the most fun part?
    2. What was the most frustrating part?
    3. Was anything confusing?
    4. Would you play more?
    5. What would you change?
    
    **Remember: Watch behavior, not just words!**
  
  test-questions: |
    # ❓ Playtest Questions by Focus
    
    What are you trying to learn?
    
    ## Core Fun Test
    
    ```yaml
    Goal: Is the basic gameplay fun?
    
    Observe:
      - Do they smile/laugh?
      - Do they lean in or back?
      - Do they want "one more try"?
      - Do they look at the clock?
    
    Ask:
      - "What did you enjoy?"
      - "When were you bored?"
      - "Would you play this again?"
    
    Success If:
      - They lose track of time
      - They express desire to continue
      - Positive body language
    ```
    
    ## Clarity Test
    
    ```yaml
    Goal: Do players understand what to do?
    
    Observe:
      - How long until first action?
      - Do they read tutorials?
      - Where do they get stuck?
      - Do they use mechanics correctly?
    
    Ask:
      - "What is your goal right now?"
      - "What does [mechanic] do?"
      - "What was confusing?"
    
    Red Flags:
      - "What am I supposed to do?"
      - Random button mashing
      - Ignoring important UI
    ```
    
    ## Difficulty Test
    
    ```yaml
    Goal: Is the challenge appropriate?
    
    Observe:
      - Death/failure count
      - Time to complete sections
      - Strategy changes over time
      - Frustration expressions
    
    Ask:
      - "How hard was that?"
      - "Did you feel challenged or frustrated?"
      - "What killed you most?"
    
    Balance Check:
      Too Easy: Boredom, distraction
      Just Right: Focused, learning
      Too Hard: Anger, giving up
    ```
    
    ## Engagement Test
    
    ```yaml
    Goal: Does the game hold attention?
    
    Observe:
      - Phone checks
      - Bathroom breaks
      - Session length (natural end)
      - "One more" requests
    
    Measure:
      - Time to first pause
      - Voluntary session length
      - Desire to return
    ```
    
    **What do you need to learn from your playtest?**
  
  feedback-analysis: |
    # 📊 Feedback Analysis
    
    Turning playtest data into action!
    
    ## Categorizing Feedback
    
    | Category | Example | Action |
    |----------|---------|--------|
    | **Bug** | "Game crashed" | Fix immediately |
    | **Confusion** | "Didn't know what to do" | Improve clarity |
    | **Balance** | "Too hard/easy" | Adjust numbers |
    | **Feature Request** | "I wish I could..." | Evaluate scope |
    | **Preference** | "I don't like the color" | Low priority |
    
    ## The Iceberg Principle
    
    ```
    What players SAY: "This boss is unfair"
                     ▲
    ─────────────────┼─────────────────
                     │
    What they MEAN:  │ "I don't understand the pattern"
                     │ "The telegraph is unclear"
                     │ "I need more healing items"
                     │ "Checkpoint is too far"
                     ▼
    ```
    
    **Players are experts at identifying problems,
    but NOT at designing solutions!**
    
    ## Priority Matrix
    
    ```
    HIGH IMPACT
         │
         │  ┌─────────┐  ┌─────────┐
         │  │ DO NOW  │  │ SCHEDULE│
         │  │ Critical│  │ Important│
         │  └─────────┘  └─────────┘
         │
         │  ┌─────────┐  ┌─────────┐
         │  │ QUICK   │  │  LATER  │
         │  │ FIX     │  │ Nice to │
         │  └─────────┘  └─────────┘
         │
         └──────────────────────────▶
                LOW EFFORT → HIGH EFFORT
    ```
    
    ## Feedback Report Template
    
    ```yaml
    Issue: [Description]
    Source: [Playtest #, Player type]
    Frequency: [How many reported?]
    
    Category: [Bug/Confusion/Balance/Feature/Preference]
    Priority: [Critical/High/Medium/Low]
    
    Root Cause: [Why is this happening?]
    Proposed Fix: [What to do]
    Effort: [Hours/Days/Weeks]
    ```
    
    **What patterns do you see in your feedback?**
