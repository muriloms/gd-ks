actions:
  technical-specs: |
    # 🔧 Technical Specifications
    
    Detailed specs for implementation!
    
    ## Spec Template
    ```yaml
    Feature: [Name]
    
    Behavior:
      - When [trigger], then [result]
      - Edge case: [scenario] → [handling]
    
    Parameters:
      - param_name: type (default) // description
    
    Data Required:
      - [DataTable/Asset]
    
    Dependencies:
      - [Other systems]
    ```
    
    **What feature needs speccing?**
  
  data-tables: |
    # 📊 Data Tables
    
    Structure your game data for easy tuning!
    
    ## Common Data Tables
    
    | Table | Columns | Purpose |
    |-------|---------|---------|
    | Items | ID, Name, Stats, Price | Item database |
    | Enemies | ID, HP, Damage, Speed | Enemy stats |
    | Levels | ID, Unlock, Rewards | Progression |
    | Dialogue | ID, Speaker, Text, Conditions | Conversations |
    
    ## Best Practices
    - Use IDs, not names for references
    - Group related data
    - Plan for localization
    
    **What data does your game need?**
  
  formulas: |
    # 🧮 Game Formulas
    
    The math behind the fun!
    
    ## Common Formulas
    
    **Damage:**
    `finalDamage = baseDamage * (1 + bonusPercent) - armor`
    
    **XP to Level:**
    `xpRequired = baseXP * (level ^ scalingPower)`
    
    **Crit Chance:**
    `critChance = baseCrit + (dexterity * critPerDex)`
    
    ## Formula Documentation
    ```
    Formula: [Name]
    Purpose: [What it calculates]
    Inputs: [Variables]
    Output: [Result]
    Example: [Sample calculation]
    ```
    
    **What calculations does your game need?**
