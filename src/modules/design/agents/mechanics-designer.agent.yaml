actions:
  player-verbs: |
    # 🎮 Player Verbs Analysis
    
    What does the player DO in your game?
    
    ## Verb Categories
    
    ### Primary Verb (Core Action)
    The ONE thing players do most. This IS your game.
    
    | Genre | Primary Verb | Example |
    |-------|--------------|---------|
    | Platformer | Jump | Mario |
    | Shooter | Shoot | Doom |
    | Puzzle | Match/Connect | Tetris |
    | RPG | Choose | Baldur's Gate |
    | Builder | Place | Minecraft |
    
    ### Secondary Verbs (Depth Layer)
    Actions that modify or expand the primary verb.
    
    ```yaml
    Primary: Jump
    Secondary:
      - Double Jump (extends primary)
      - Wall Jump (contextual)
      - Ground Pound (reversal)
      - Glide (modifier)
    ```
    
    ### Support Verbs (Utility)
    Actions that don't define gameplay but enable it.
    
    - Move / Navigate
    - Interact / Use
    - Open Menu / Inventory
    - Save / Load
    
    ## Verb Hierarchy Template
    
    ```yaml
    Game: [Your Game]
    
    Core Verb:
      Action: [What player does most]
      Frequency: [Per second / minute / session]
      Satisfaction: [Why it feels good]
    
    Secondary Verbs:
      - Action: [Name]
        Relation to Core: [Extends/Modifies/Counters]
        Unlock: [When available]
    
    Support Verbs:
      - [List utility actions]
    ```
    
    **What is your player's PRIMARY verb?**
  
  mechanic-interactions: |
    # 🔄 Mechanic Interactions
    
    Great games have mechanics that TALK to each other!
    
    ## Interaction Types
    
    | Type | Description | Example |
    |------|-------------|---------|
    | **Combo** | A + B = Enhanced | Jump + Attack = Dive Attack |
    | **Cancel** | A interrupts B | Dash cancels attack recovery |
    | **Synergy** | A makes B better | Fire + Oil = Explosion |
    | **Counter** | A negates B | Shield blocks projectile |
    | **Sequence** | A enables B | Stun → Execute |
    
    ## Interaction Matrix
    
    Map how your mechanics interact:
    
    ```
              | Jump | Attack | Block | Dash |
    ----------|------|--------|-------|------|
    Jump      |  -   | Aerial | -     | Air  |
    Attack    | Dive |   -    | Parry | Lunge|
    Block     | -    | Counter|   -   | -    |
    Dash      | Long | Rush   | -     |  -   |
    ```
    
    ## Emergent Gameplay
    
    When mechanics interact, players discover strategies:
    
    ```yaml
    Designed Interaction:
      Mechanics: [Fire] + [Arrow]
      Result: Fire Arrow
      Intended: Yes
    
    Emergent Interaction:
      Mechanics: [Fire] + [Grass] + [Wind]
      Result: Spreading wildfire
      Intended: Discovered by players
    ```
    
    **How do your mechanics interact?**
  
  input-mapping: |
    # 🎮 Input Mapping
    
    The bridge between player intention and game action!
    
    ## Input Principles
    
    1. **Consistency** - Same input = same result
    2. **Responsiveness** - Instant feedback
    3. **Ergonomics** - Frequent actions on easy buttons
    4. **Discoverability** - Intuitive mappings
    
    ## Input Mapping Template
    
    ### Controller Layout
    
    ```yaml
    Face Buttons:
      A/Cross: [Primary action - most used]
      B/Circle: [Secondary/Cancel]
      X/Square: [Interact/Use]
      Y/Triangle: [Special/Alt]
    
    Shoulders:
      LB/L1: [Modifier/Aim]
      RB/R1: [Attack/Action]
      LT/L2: [Block/Secondary Aim]
      RT/R2: [Primary Attack/Confirm]
    
    Sticks:
      Left Stick: [Movement]
      Right Stick: [Camera/Aim]
      L3: [Sprint/Crouch]
      R3: [Lock-on/Ping]
    
    D-Pad:
      Up: [Item 1 / Quick slot]
      Down: [Item 2 / Crouch]
      Left: [Item 3 / Weapon swap]
      Right: [Item 4 / Ability]
    ```
    
    ### Keyboard + Mouse
    
    ```yaml
    Movement: WASD
    Camera: Mouse
    Primary Action: Left Click
    Secondary: Right Click
    Interact: E
    Jump: Space
    Crouch: Ctrl / C
    Sprint: Shift
    Abilities: Q, F, R
    Items: 1-4
    Menu: Escape / Tab
    ```
    
    ## Response Time Guidelines
    
    | Action Type | Max Latency | Feel |
    |------------|-------------|------|
    | Movement | < 50ms | Instant |
    | Attack | < 100ms | Responsive |
    | Menu | < 150ms | Snappy |
    | Save/Load | < 500ms | Acceptable |
    
    **What's your control scheme?**
