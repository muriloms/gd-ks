actions:
  protagonist-design: |
    # 🦸 Protagonist Design
    
    Your hero's journey starts here!
    
    ## Protagonist Template
    
    ```yaml
    Name: [Name]
    Role: [Player character / Named protagonist]
    
    The Basics:
      Age: [Age or range]
      Background: [Where they come from]
      Occupation: [What they do]
      Status: [Social position at start]
    
    Appearance:
      Physical: [Build, height, features]
      Style: [How they present themselves]
      Distinguishing: [What makes them recognizable]
    
    Psychology:
      Personality Type: [Brief description]
      Strengths: [What they're good at]
      Weaknesses: [What holds them back]
      
    The Want/Need:
      External Want: [What they think they need]
      Internal Need: [What they actually need]
      Ghost: [Past trauma/event that shaped them]
      Lie: [False belief they hold]
      
    Arc:
      Beginning: [Who they are at start]
      Midpoint: [Crisis/revelation]
      End: [Who they become]
      
    Abilities:
      Starting: [What they can do]
      Potential: [What they could learn]
      Signature: [Their unique skill/trait]
    ```
    
    **Who is your protagonist?**
  
  antagonist-design: |
    # 🦹 Antagonist Design
    
    Great villains believe they're the hero!
    
    ## Antagonist Template
    
    ```yaml
    Name: [Name]
    Type: [Villain/Rival/Force of nature/System/Inner demon]
    
    The Basics:
      Position: [Their role/power]
      Resources: [What they command]
      Reach: [Scope of influence]
    
    Motivation:
      Goal: [What they want]
      Reason: [WHY they want it]
      Method: [How they pursue it]
      Justification: [How they see themselves]
      
    Mirror to Hero:
      Similarity: [What they share with protagonist]
      Difference: [Key divergence]
      Contrast: [What they represent vs hero]
      
    Threat Level:
      Physical: [Combat threat]
      Intellectual: [Strategic threat]
      Social: [Influence threat]
      Personal: [Emotional threat to hero]
      
    Humanity:
      Sympathetic Trait: [What makes them understandable]
      Line They Won't Cross: [Their limit, if any]
      Weakness: [Their vulnerability]
      
    Arc:
      Introduction: [How we meet them]
      Escalation: [How threat grows]
      Climax: [Final confrontation]
      Fate: [What happens to them]
    ```
    
    **Who opposes your protagonist?**
  
  npc-design: |
    # 🧑‍🤝‍🧑 NPC Design
    
    The world needs people!
    
    ## NPC Categories
    
    ### Major NPCs (Named, recurring)
    
    ```yaml
    Name: [Name]
    Role: [Mentor/Ally/Love Interest/Questgiver/etc]
    Location: [Where found]
    
    Quick Profile:
      One-line Description: [Sum them up]
      Personality: [2-3 key traits]
      Want: [What they need from player]
      Offer: [What they provide]
      
    Appearance:
      Visual Hook: [Most memorable feature]
      Style: [How they dress/present]
      
    Voice:
      Speech Pattern: [How they talk]
      Catchphrase: [Memorable line, if any]
      
    Story Function:
      First Meeting: [Initial interaction]
      Relationship Arc: [How it evolves]
      Key Moment: [Most important scene]
    ```
    
    ### Minor NPCs (Functional)
    
    | Type | Examples | Purpose |
    |------|----------|---------|
    | Merchants | Shopkeeper, blacksmith | Economy/gear |
    | Service | Innkeeper, healer | Rest/recovery |
    | Information | Guards, travelers | Lore/quests |
    | Flavor | Villagers, crowds | Atmosphere |
    
    **What NPCs populate your world?**
  
  relationship-map: |
    # 💕 Relationship Map
    
    No character exists in isolation!
    
    ## Relationship Types
    
    | Type | Examples | Drama Potential |
    |------|----------|-----------------|
    | Family | Parent, sibling, child | High (obligation) |
    | Romantic | Partner, ex, crush | High (emotion) |
    | Friendship | Ally, rival-friend | Medium (loyalty) |
    | Professional | Boss, colleague, student | Medium (hierarchy) |
    | Antagonistic | Enemy, rival, nemesis | High (conflict) |
    
    ## Relationship Template
    
    ```yaml
    Characters: [A] ←→ [B]
    Type: [Relationship type]
    
    History:
      Origin: [How they met]
      Key Events: [Defining moments]
      Current State: [Where it stands now]
      
    Dynamics:
      Power Balance: [Who has leverage]
      Trust Level: [How much they trust]
      Tension Points: [Sources of conflict]
      
    Story Potential:
      Could Break: [What would end it]
      Could Strengthen: [What would deepen it]
      Player Influence: [Can player affect it]
    ```
    
    ## Relationship Web
    
    Draw connections:
    ```
    [Character A] ---(type)---> [Character B]
                  <--(type)---
    ```
    
    **What are the key relationships?**
  
  character-arcs: |
    # 📈 Character Arcs
    
    Characters must CHANGE!
    
    ## Arc Types
    
    | Type | Description | Example |
    |------|-------------|---------|
    | Positive | Overcomes flaw | Coward → Brave |
    | Negative | Succumbs to flaw | Good → Corrupted |
    | Flat | Tests belief | Stays true despite trials |
    | Transformative | Becomes new person | Human → Monster |
    
    ## Arc Structure
    
    ```yaml
    Character: [Name]
    Arc Type: [Positive/Negative/Flat/Transformative]
    
    The Lie: [False belief at start]
    The Truth: [What they need to learn]
    
    Act 1 - Setup:
      Starting State: [Who they are]
      Desire: [What they want]
      Fear: [What they avoid]
      
    Act 2 - Conflict:
      Challenge: [What tests them]
      Doubt: [When they question]
      Low Point: [Their worst moment]
      
    Act 3 - Resolution:
      Choice: [The defining decision]
      Change: [How they're different]
      New State: [Who they become]
      
    Evidence of Change:
      Dialogue: [How speech changes]
      Actions: [What they do differently]
      Relationships: [How connections shift]
    ```
    
    **What arcs do your characters have?**
