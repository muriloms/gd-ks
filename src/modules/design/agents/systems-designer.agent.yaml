actions:
  emergent-gameplay: |
    # ✨ Emergent Gameplay
    
    When players discover strategies you never designed!
    
    ## Emergence Levels
    
    | Level | Description | Example |
    |-------|-------------|---------|
    | **Designed** | Intended combo | Fire + Arrow = Fire Arrow |
    | **Enabled** | Possible, not taught | Grenade jump |
    | **Emergent** | Surprising but logical | Stacking physics objects |
    | **Exploit** | Unintended, fun | Speedrun tricks |
    
    ## Creating Emergence
    
    ```yaml
    System A: [Name]
      Properties:
        - [Property 1]
        - [Property 2]
      
    System B: [Name]
      Properties:
        - [Property 1]
        - [Property 2]
    
    Interaction Matrix:
      A.Prop1 + B.Prop1 = [Result]
      A.Prop1 + B.Prop2 = [Result]
      A.Prop2 + B.Prop1 = [Result]
      A.Prop2 + B.Prop2 = [Result]
      
    Designed: [Which were intentional?]
    Emergent: [Which surprised you?]
    ```
    
    ## Encouraging Emergence
    
    ✅ DO:
    - Make systems interact with each other
    - Give players tools, not solutions
    - Reward creative thinking
    - Keep rules consistent
    
    ❌ DON'T:
    - Script every outcome
    - Patch emergent fun
    - Make "correct" solutions
    - Over-constrain player actions
    
    **What surprises do you want players to discover?**
  
  elemental-system: |
    # 🔥 Elemental/Environmental Systems
    
    Classic system interaction design!
    
    ## Element Interaction Matrix
    
    ```
              | Fire | Water | Ice  | Wind | Electric |
    ----------|------|-------|------|------|----------|
    Fire      |  +   | Cancel| Melt | Spread| -       |
    Water     |Cancel|   +   | Freeze| Splash| Conduct|
    Ice       | Melt |Freeze |   +  | Shatter| -      |
    Wind      |Spread|Splash |Shatter|  +   | -       |
    Electric  |  -   |Conduct|  -   |  -   |    +     |
    ```
    
    ## Environmental Objects
    
    ```yaml
    Object: Wooden Barrel
    Properties:
      - Flammable
      - Breakable
      - Floating
    
    Interactions:
      + Fire = Burns, spreads fire
      + Water = Floats
      + Impact = Breaks
      + Ice = No effect
      
    Gameplay Uses:
      - Fire trap
      - Bridge across water
      - Explosive chain
    ```
    
    ## Interaction Template
    
    For each interactive object:
    
    ```yaml
    Object: [Name]
    
    Material Properties:
      - [Property 1]
      - [Property 2]
    
    Reacts To:
      [Element/Force]: [Result]
      [Element/Force]: [Result]
    
    Player Uses:
      - [Strategy 1]
      - [Strategy 2]
    ```
    
    **What environmental interactions exist?**
  
  ai-systems: |
    # 🤖 AI Systems Integration
    
    How NPCs interact with your systems!
    
    ## AI System Awareness
    
    ```yaml
    Enemy Type: [Name]
    
    System Awareness:
      Fire: 
        Detects: Yes/No
        Reaction: [Flee/Use/Ignore]
      Water:
        Detects: Yes/No
        Reaction: [Flee/Use/Ignore]
      Sound:
        Detects: Yes/No
        Reaction: [Investigate/Alert/Ignore]
    
    Uses Systems:
      - Can create fire: Yes/No
      - Uses cover: Yes/No
      - Sets traps: Yes/No
    ```
    
    ## AI Tactical Considerations
    
    | AI Type | Uses Systems | Avoids | Creates |
    |---------|--------------|--------|---------|
    | Grunt | No | Fire | None |
    | Archer | Cover | Melee | Fire arrows |
    | Mage | Elements | Physical | Traps |
    | Boss | Everything | Nothing | Hazards |
    
    ## Emergent AI Moments
    
    Best when AI surprises the player:
    
    ```yaml
    Scenario: [Description]
    
    AI Action: [What AI does]
    Systems Used: [Which systems]
    Player Reaction: [Surprise/Delight/Challenge]
    
    Example:
      Scenario: Player hiding in grass
      AI Action: Archer fires fire arrow
      Systems Used: Fire + Grass = Spread
      Player Reaction: "Whoa, they're smart!"
    ```
    
    **How do your enemies use the systems?**
