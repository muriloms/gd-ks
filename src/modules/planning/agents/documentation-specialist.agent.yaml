actions:
  story-templates: |
    # 📋 Story Templates
    
    ## User Story Format
    ```
    As a [type of user]
    I want [goal/desire]
    So that [benefit/reason]
    ```
    
    ## Story Card Template
    ```yaml
    ID: GDKS-XXX
    Title: [Short descriptive title]
    Epic: [Parent epic]
    Priority: Must/Should/Could
    Points: [Estimate]
    
    Description:
      [User story format]
    
    Acceptance Criteria:
      - [ ] Given [context], when [action], then [result]
    
    Technical Notes:
      - [Implementation hints]
    
    Dependencies:
      - [Other stories/systems]
    ```
    
    **Need a template for something?**
  
  definition-of-done: |
    # ✅ Definition of Done
    
    A story is DONE when:
    
    ## Code Complete
    - [ ] Feature implemented
    - [ ] Code reviewed
    - [ ] No compiler warnings
    
    ## Tested
    - [ ] Unit tests pass
    - [ ] Manual testing done
    - [ ] Edge cases covered
    
    ## Documented
    - [ ] Code commented
    - [ ] Design doc updated
    
    ## Integrated
    - [ ] Merged to main
    - [ ] Build succeeds
    - [ ] No regressions
    
    **Customize your DoD!**
  
  acceptance-criteria: |
    # 📝 Writing Acceptance Criteria
    
    ## Given-When-Then Format
    
    ```
    Given [initial context/state]
    When [action/trigger]
    Then [expected result]
    ```
    
    ## Examples
    
    **Good:**
    - Given player has full health
    - When player takes 10 damage
    - Then player health shows 90
    
    **Bad:**
    - Player health works correctly
    (Too vague! What is "correctly"?)
    
    ## Tips
    - Be specific with numbers
    - Cover edge cases
    - Include error states
    - Test the criteria before dev
    
    **What feature needs acceptance criteria?**
